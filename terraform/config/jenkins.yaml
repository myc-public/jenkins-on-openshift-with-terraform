jenkins:
  systemMessage: "Jenkins Platform - Managed by Configuration as Code"
  numExecutors: 0

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "${JENKINS_ADMIN_PASSWORD}"

  authorizationStrategy:
    globalMatrix:
      entries:
        - user:
            name: "admin"
            permissions:
              - "Overall/Administer"

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: "sonarqube-token"
              secret: "${SONAR_TOKEN}"
              description: "SonarQube authentication token"
          - usernamePassword:
              scope: GLOBAL
              id: "nexus-credentials"
              username: "${NEXUS_USERNAME}"
              password: "${NEXUS_PASSWORD}"
              description: "Nexus repository credentials (read maven-public, deploy releases/snapshots)"

unclassified:
  location:
    url: "https://jenkins-gregorie769-dev.apps.rm3.7wse.p1.openshiftapps.com"

  globalConfigFiles:
    configs:
      - custom:
          id: "nexus-maven-settings"
          name: "nexus-maven-settings.xml"
          comment: "Maven settings.xml enforcing Nexus as the sole repository (blocks direct Maven Central access)"
          content: |
            <settings xmlns="http://maven.apache.org/SETTINGS/1.2.0"
                      xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                      xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.2.0 https://maven.apache.org/xsd/settings-1.2.0.xsd">
                <mirrors>
                    <mirror>
                        <id>nexus</id>
                        <mirrorOf>*</mirrorOf>
                        <name>Nexus - single entry point for all repositories</name>
                        <url>https://defend-provider-ladder-biographies.trycloudflare.com/repository/maven-public/</url>
                    </mirror>
                </mirrors>
                <servers>
                    <server>
                        <id>nexus</id>
                        <username>^${env.NEXUS_USERNAME}</username>
                        <password>^${env.NEXUS_PASSWORD}</password>
                    </server>
                    <server>
                        <id>nexus-releases</id>
                        <username>^${env.NEXUS_USERNAME}</username>
                        <password>^${env.NEXUS_PASSWORD}</password>
                    </server>
                    <server>
                        <id>nexus-snapshots</id>
                        <username>^${env.NEXUS_USERNAME}</username>
                        <password>^${env.NEXUS_PASSWORD}</password>
                    </server>
                </servers>
            </settings>

  mailer:
    smtpHost: "${SMTP_HOST}"
    smtpPort: "${SMTP_PORT}"
    useSsl: true
    authentication:
      username: "${SMTP_USERNAME}"
      password: "${SMTP_PASSWORD}"

  sonarGlobalConfiguration:
    installations:
      - name: "sonarqube"
        serverUrl: "${SONAR_SERVER_URL}"
        credentialsId: "sonarqube-token"