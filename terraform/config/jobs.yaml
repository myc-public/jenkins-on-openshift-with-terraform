
jobs:
    - script: |
          pipelineJob('gen-ai-api') {
              description('CI/CD pipeline for gen-ai-api')
          
              definition {
                  cpsScm {
                      scm {
                          git {
                              remote {
                                  url('https://github.com/myc-public/gen-ai-api.git')
                              }
                              branches('*/main')
                          }
                      }
                      scriptPath('cicd/Jenkinsfile-ci')
                      lightweight(true)
                  }
              }

              properties {
                  disableConcurrentBuilds()
              }

              logRotator {
                  numToKeep(20)
                  daysToKeep(30)
              }
          }

