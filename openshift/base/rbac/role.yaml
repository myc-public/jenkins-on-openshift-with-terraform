apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins
  labels:
    app.kubernetes.io/name: jenkins

rules:
  - apiGroups: [""]
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
      - create
      - delete

  - apiGroups: [""]
    resources:
      - pods/exec
    verbs:
      - get
      - create

  - apiGroups: [""]
    resources:
      - pods/log
    verbs:
      - get
      - list
      - watch