apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: jenkins
  labels:
    app.kubernetes.io/name: jenkins
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: jenkins
  labels:
    app.kubernetes.io/name: jenkins
spec:
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: jenkins:latest