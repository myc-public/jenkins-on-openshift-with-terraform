jenkins:
  systemMessage: "Jenkins Platform - Managed by Configuration as Code"
  numExecutors: 0

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "${JENKINS_ADMIN_PASSWORD}"

  authorizationStrategy:
    globalMatrix:
      entries:
        - user:
            name: "admin"
            permissions:
              - "Overall/Administer"

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: "sonarqube-token"
              secret: "${SONAR_TOKEN}"
              description: "SonarQube authentication token"

unclassified:
  location:
    url: "https://jenkins-gregorie769-dev.apps.rm3.7wse.p1.openshiftapps.com"

  sonarGlobalConfiguration:
    installations:
      - name: "sonarqube"
        serverUrl: "${SONAR_SERVER_URL}"
        credentialsId: "sonarqube-token"